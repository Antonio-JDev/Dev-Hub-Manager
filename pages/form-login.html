<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login / Cadastro - DevHub Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1", // Indigo 500
                        secondary: "#10b981", // Emerald 500
                        warning: "#f59e0b", // Amber 500
                        danger: "#ef4444", // Red 500
                        "background-light": "#f3f4f6", // Gray 100
                        "background-dark": "#0B1121", // Deep Navy
                        "surface-light": "#ffffff",
                        "surface-dark": "#151E32", // Lighter Navy for cards
                        "border-light": "#e5e7eb",
                        "border-dark": "#2d3748",
                        "text-main-light": "#111827",
                        "text-main-dark": "#f3f4f6",
                        "text-muted-light": "#6b7280",
                        "text-muted-dark": "#9ca3af",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>
</head>

<body
    class="bg-background-dark text-text-main-dark font-body antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/20 rounded-full blur-[120px] opacity-40">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/10 rounded-full blur-[120px] opacity-40">
        </div>
    </div>
    <main class="w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-14 h-14 bg-primary rounded-xl text-white font-bold text-3xl shadow-lg shadow-indigo-500/30 mb-4">
                D
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">DevHub Manager</h1>
            <p class="text-text-muted-dark mt-2 text-sm">Gestão de Projetos Ágeis para Desenvolvedores</p>
        </div>
        <div class="bg-surface-dark border border-border-dark rounded-2xl shadow-2xl overflow-hidden">
            <div class="flex border-b border-border-dark">
                <button
                    class="flex-1 py-4 text-sm font-semibold text-primary border-b-2 border-primary bg-background-dark/30 transition-colors">
                    Log In
                </button>
                <button
                    class="flex-1 py-4 text-sm font-medium text-text-muted-dark hover:text-white border-b-2 border-transparent hover:bg-white/5 transition-colors">
                    Cadastrar
                </button>
            </div>
            <div class="p-8">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button
                        class="flex items-center justify-center gap-2 py-2.5 px-4 bg-[#0B1121] border border-border-dark rounded-lg hover:bg-white/5 hover:border-gray-500 transition-all group">
                        <svg class="w-5 h-5 text-white group-hover:text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z">
                            </path>
                        </svg>
                        <span class="text-sm font-medium text-text-muted-dark group-hover:text-white">GitHub</span>
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 py-2.5 px-4 bg-[#0B1121] border border-border-dark rounded-lg hover:bg-white/5 hover:border-gray-500 transition-all group">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"></path>
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"></path>
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z"
                                fill="#FBBC05"></path>
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335"></path>
                        </svg>
                        <span class="text-sm font-medium text-text-muted-dark group-hover:text-white">Google</span>
                    </button>
                </div>
                <div class="relative flex py-2 items-center mb-6">
                    <div class="flex-grow border-t border-border-dark"></div>
                    <span class="flex-shrink-0 mx-4 text-xs text-text-muted-dark uppercase tracking-wider">Ou continue
                        com</span>
                    <div class="flex-grow border-t border-border-dark"></div>
                </div>
                <form action="#" class="space-y-5" method="POST">
                    <div>
                        <label class="block text-sm font-medium text-text-muted-dark mb-1.5" for="email">Endereço de email
                            </label>
                        <div class="relative">
                            <span
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-text-muted-dark">
                                <span class="material-icons-outlined text-[20px]">email</span>
                            </span>
                            <input
                                class="block w-full pl-10 pr-3 py-2.5 bg-[#0B1121] border border-border-dark rounded-lg text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent sm:text-sm transition-shadow"
                                id="email" name="email" placeholder="name@company.com" type="email" />
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-sm font-medium text-text-muted-dark"
                                for="password">Senha</label>
                            <a class="text-xs font-medium text-primary hover:text-indigo-400 transition-colors"
                                href="#">Esqueceu a senha?</a>
                        </div>
                        <div class="relative">
                            <span
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-text-muted-dark">
                                <span class="material-icons-outlined text-[20px]">lock</span>
                            </span>
                            <input
                                class="block w-full pl-10 pr-3 py-2.5 bg-[#0B1121] border border-border-dark rounded-lg text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent sm:text-sm transition-shadow"
                                id="password" name="password" placeholder="********" type="password" />
                        </div>
                    </div>
                    <div class="flex items-center">
                        <input class="h-4 w-4 text-primary focus:ring-primary border-border-dark rounded bg-[#0B1121]"
                            id="remember-me" name="remember-me" type="checkbox" />
                        <label class="ml-2 block text-sm text-text-muted-dark" for="remember-me">
                            Lembrar-me por 15 dias
                        </label>
                    </div>  
                    <button
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-[#151E32] transition-colors shadow-lg shadow-indigo-500/20"
                        type="submit">
                        Entrar
                    </button>
                </form>
                <p class="mt-8 text-center text-sm text-text-muted-dark">
                    Não tem uma conta?
                    <a class="font-medium text-primary hover:text-indigo-400 transition-colors" href="#">Criar uma conta nova   
                        </a>
                </p>
            </div>
            <div class="bg-[#0B1121]/50 p-4 border-t border-border-dark flex justify-center gap-6">
                <div class="flex items-center gap-1.5 opacity-50">
                    <span class="material-icons-outlined text-[16px] text-secondary">verified_user</span>
                    <span class="text-[10px] text-text-muted-dark uppercase tracking-wider">Conexão Segura</span>
                </div>
            </div>
        </div>
        <div class="mt-8 text-center">
            <p class="text-xs text-text-muted-dark opacity-60">© 2026 DevHub Manager. Todos os direitos reservados.</p>
        </div>
    </main>

</body>

</html>
